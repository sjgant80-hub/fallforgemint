name: rerun
# The CI re-run rail. Give it a FallForge Mint re-run bundle (the signed scorecard, the recipe and the held-out rows)
# and a clean GitHub runner does two things, in the open:
#   1. RE-VERIFY: recompute every recorded number from the bundle — the bundle and receipt fingerprints, the rebuilt
#      Modelfile's hash, the task and evidence hashes, the scores, the held-out disjointness, the signature. If the
#      receipt names a CI run (its `rerun` link), look that run up on GitHub and check it made THIS exact receipt.
#      Any mismatch is TAMPERED and the job FAILS. A tampered record is never re-executed.
#   2. RE-EXECUTE: rebuild the minted model with Ollama on this runner, run every held-out input through base and
#      minted again, and grade it. Same runtime and model digest → the hits must match exactly (REPRODUCED);
#      a different runtime (a browser-made scorecard) → the verdict must hold (AGREES). Otherwise DID_NOT_REPRODUCE,
#      and the job FAILS.
# The verdict is the job summary plus a self-hashed attestation bound to this run's URL (artifact: rerun-result).
# Anyone can run it: call it from your own repo (see github.com/sjgant80-hub/fallforgemint-rerun), or fork this repo.
# Every judgement is in kernel.mjs, which is mutation-gated; tools/rerun.mjs is only the edge that talks to Ollama and GitHub.
# The rail's code is always checked out at the commit of THIS workflow file, so whoever calls it cannot choose which
# code judges their bundle — and a receipt minted here can be traced to that commit.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify a bundle, or mint a fresh CI-origin scorecard from a spec'
        type: choice
        options: [verify, mint]
        default: verify
      bundle:
        description: 'verify: path in this repo or https URL of a re-run bundle · mint: path of a spec { task, examples, holdout, base }'
        required: true
        default: rerun/proof/genuine.json
  workflow_call:
    inputs:
      bundle:
        description: 'path in the calling repo, or an https URL, of the re-run bundle (verify) or spec (mint)'
        type: string
        required: true
      mode:
        type: string
        default: verify
      rail-ref:
        description: 'ignored (kept so older callers still run): the rail always runs the code of the workflow commit you call'
        type: string
        default: main

permissions:
  contents: read
  actions: read          # to read the artifact of the run a receipt's rerun link names

jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OLLAMA_VERSION: 0.34.4          # pinned: the runtime is part of what a re-run reproduces
    steps:
      - name: check out the repo that holds the bundle
        uses: actions/checkout@v4

      - name: check out the rail at this workflow's own commit (fallforgemint's gated kernel + runner)
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .rail

      - name: the rail's code is this workflow's commit
        env:
          WANT: ${{ job.workflow_sha }}
        run: |
          got="$(git -C .rail rev-parse HEAD)"
          echo "rail commit: $got (workflow: ${{ job.workflow_repository }}@$WANT)"
          if [ -z "$WANT" ] || [ "$got" != "$WANT" ]; then echo "::error::the rail's code is not the commit of the workflow that called it"; exit 1; fi

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: install Ollama ${{ env.OLLAMA_VERSION }} (CPU)
        run: |
          curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION="$OLLAMA_VERSION" sh
          if ! curl -sf http://127.0.0.1:11434/api/version >/dev/null; then (ollama serve >/tmp/ollama.log 2>&1 &); fi
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 1; done
          ollama --version

      - name: run the rail
        env:
          MODE: ${{ inputs.mode || 'verify' }}
          BUNDLE: ${{ inputs.bundle }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$MODE" = "mint" ]; then
            node .rail/tools/rerun.mjs mint "$BUNDLE" --out rerun-bundle.json --summary "$GITHUB_STEP_SUMMARY"
          else
            node .rail/tools/rerun.mjs verify "$BUNDLE" --out rerun-result.json --summary "$GITHUB_STEP_SUMMARY"
          fi

      - name: publish the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rerun-result
          path: |
            rerun-result.json
            rerun-bundle.json
          if-no-files-found: ignore
